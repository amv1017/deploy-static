<svg
  viewBox="0 0 200 200"
  height="200"
  width="200"
  xmlns="http://www.w3.org/2000/svg"
>
  <rect
    id="rectsquare2"
    width="100"
    height="100"
    x="50"
    y="50"
    style="fill: purple"
  />

  <style>
    @keyframes logo-spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    #rectsquare2 {
      transform-origin: center;
      animation: logo-spin infinite 7.2s linear;
    }
  </style>
</svg>
