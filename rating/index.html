<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .btn-panel {
        display: flex;
        justify-content: space-around;
      }

      .btn-panel button,
      .btn-panel b {
        padding: 5px;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div class="rating">
      <span class="gold"></span>
      <span class="gray"></span>
    </div>

    <div class="btn-panel">
      <div>
        <button class="btn-add-rating">add 0.1</button>
        <b class="rating-value"></b>
        <button class="btn-rem-rating">rem 0.1</button>
      </div>

      <div>
        <button class="btn-add-fs">add 5</button>
        <b class="fs-value">font</b>
        <button class="btn-rem-fs">rem 5</button>
      </div>
    </div>
  </body>
</html>
