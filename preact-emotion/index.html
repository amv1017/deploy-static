<!DOCTYPE html>
<html>
<head>
  <title>Preact Emotion CDN Example</title>
  <script src="https://unpkg.com/preact@10.5.14/dist/preact.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/preact-emotion@9.2.12/dist/index.cjs.min.js"></script>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { h, render } from 'https://unpkg.com/preact@10.5.14/dist/preact.module.js';
    import { styled } from 'https://cdn.jsdelivr.net/npm/preact-emotion@9.2.12/dist/preact-emotion.esm.js';

    const MyStyledComponent = styled('div')
      background-color: hotpink;
      color: white;
      padding: 10px;
      border-radius: 5px;
    ;

    function App() {
      return h(MyStyledComponent, null, 'Hello from Emotion in Preact!');
    }

    render(h(App), document.getElementById('app'));
  </script>
</body>
</html>
